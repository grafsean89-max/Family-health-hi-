<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Family Health Hub — Demo</title><style>:root{font-family:Inter,system-ui,Arial;color:#192a37;background:#f4f7fa}*{box-sizing:border-box}body{margin:0}header{background:#173c4b;color:white;padding:24px max(22px,calc((100vw - 1120px)/2))}header p{opacity:.75;margin:6px 0}.wrap{max-width:1120px;margin:25px auto;padding:0 20px}.warning{background:#fff4d6;border:1px solid #e8c46a;padding:13px;border-radius:12px;margin-bottom:20px}nav{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px}button{cursor:pointer;border:1px solid #d4dfe7;background:white;border-radius:9px;padding:10px 14px;color:#193f4d}button.active,button.primary{background:#176477;color:white;border-color:#176477}.panel{background:white;border:1px solid #e1e9ef;border-radius:14px;padding:20px;margin-bottom:14px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}.stat strong{font-size:28px;display:block}.muted{color:#647782;font-size:14px}.item{border-bottom:1px solid #e6edf0;padding:12px 0}.item:last-child{border-bottom:0}input,textarea,select{padding:10px;border:1px solid #bacbd5;border-radius:8px;font:inherit;max-width:100%}input[type=text]{width:min(100%,460px)}textarea{width:100%;min-height:85px}label{display:block;margin:12px 0 5px}.tag{display:inline-block;background:#e8f2f4;color:#176477;padding:4px 8px;border-radius:30px;font-size:12px}.hidden{display:none}small{color:#647782}h2{margin-top:0}a{color:#176477}</style></head><body><header><h1>♥ Family Health Hub</h1><p>Interactive local prototype · Fictional information only</p></header><main class="wrap"><div class="warning"><b>DEMO — NOT SECURE MEDICAL STORAGE.</b> Do not enter real names, medical details, documents, or recordings. No backend, authentication, encryption, upload processing, or persistent storage is implemented.</div><nav id="nav"></nav><section id="view"></section></main><script>
const meds=[['Lisinopril','10 mg','Morning','Dr. Patel','Confirmed'],['Atorvastatin','20 mg','Evening','Dr. Patel','Confirmed'],['Metformin','500 mg','Twice daily','Dr. Chen','Review needed']];const doctors=[['Dr. Taylor Morgan','Primary care','Overall coordination'],['Dr. A. Patel','Cardiology','Cardiovascular care'],['Dr. R. Chen','Endocrinology','Metabolic care']];const appointments=[['Oct 21, 2026','Primary care review','Medication reconciliation and memory concerns'],['Nov 5, 2026','Cardiology follow-up','Review results and treatment plan']];let tasks=[{text:'Confirm medication instructions with prescribing office',done:false},{text:'Schedule follow-up blood work',done:false},{text:'Request specialist visit summary',done:true}];let section='Overview';const sections=['Overview','History','Medications','Doctors','Appointments','Documents & AI','Family access'];const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const row=(title,desc,extra='')=>`<div class="item"><b>${esc(title)}</b> ${extra}<div class="muted">${esc(desc)}</div></div>`;function render(){document.getElementById('nav').innerHTML=sections.map(s=>`<button class="${s===section?'active':''}" data-section="${esc(s)}">${esc(s)}</button>`).join('');let h='';if(section==='Overview'){h=`<div class="grid">${[['Medications',3],['Care providers',3],['Appointments',2],['Open tasks',tasks.filter(t=>!t.done).length]].map(([l,n])=>`<div class="panel stat"><strong>${n}</strong><span class="muted">${l}</span></div>`).join('')}</div><div class="panel"><h2>Needs attention</h2>${row('Medication discrepancy','Example imported note suggests a dosage change. Verify against signed instructions.','<span class="tag">Unverified</span>')}</div><div class="panel"><h2>Follow-up tasks</h2>${tasks.map((t,i)=>`<div class="item"><label><input type="checkbox" data-task="${i}" ${t.done?'checked':''}> ${esc(t.text)}</label></div>`).join('')}<form id="taskForm"><label for="task">Add a demo task</label><input id="task" type="text" maxlength="180" required placeholder="Follow up with doctor"><button class="primary">Add</button></form></div>`}else if(section==='History'){h=`<div class="panel"><h2>Medical history timeline</h2>${row('September 2026 · Cardiology','Routine follow-up; blood pressure management discussed')}${row('August 2026 · Laboratory testing','Metabolic testing performed; follow-up requested')}${row('2023 · Hypertension','Example condition documented')}</div>`}else if(section==='Medications'){h=`<div class="panel"><h2>Medication register</h2>${meds.map(m=>row(m[0]+' · '+m[1],m[2]+' · Prescriber: '+m[3],`<span class="tag">${m[4]}</span>`)).join('')}<small>Fictional medication examples, not medical instructions.</small></div>`}else if(section==='Doctors'){h=`<div class="panel"><h2>Care team</h2>${doctors.map(d=>row(d[0]+' · '+d[1],d[2])).join('')}</div>`}else if(section==='Appointments'){h=`<div class="panel"><h2>Upcoming appointments</h2>${appointments.map(a=>row(a[0]+' · '+a[1],a[2])).join('')}</div>`}else if(section==='Documents & AI'){h=`<div class="panel"><h2>Document and recording intake</h2><p>Production flow: authenticated upload → private storage → extraction/transcription → source-linked AI suggestions → human approval.</p><label for="type">Preview an example</label><select id="type"><option>Visit note</option><option>Audio recording</option><option>Lab report</option></select><div id="preview" class="panel" style="margin-top:12px"></div><label>Production upload controls</label><input type="file" disabled><p class="muted">Uploads are intentionally disabled until secure infrastructure is deployed.</p></div>`}else{h=`<div class="panel"><h2>Family permissions</h2>${row('Mother · Patient/owner','Controls sharing and medical decisions')}${row('Adult child · Coordinator','Records, appointments, communications')}${row('Father · Caregiver','Schedules and day-to-day support')}<p class="muted">Server-enforced access, individual login, consent management and audit history are required in production.</p></div>`}document.getElementById('view').innerHTML=h;document.querySelectorAll('[data-section]').forEach(b=>b.onclick=()=>{section=b.dataset.section;render()});document.querySelectorAll('[data-task]').forEach(b=>b.onchange=()=>{tasks[+b.dataset.task].done=b.checked;render()});const f=document.getElementById('taskForm');if(f)f.onsubmit=e=>{e.preventDefault();const val=document.getElementById('task').value.trim();if(val){tasks.push({text:val,done:false});render()}};const sel=document.getElementById('type');if(sel){const update=()=>{const examples={'Visit note':'Possible medication adjustment mentioned. Confirm dose against clinician instructions.','Audio recording':'A follow-up visit may have been requested. Confirm date from signed visit summary.','Lab report':'Example test values would be linked to the original report for clinician interpretation.'};document.getElementById('preview').innerHTML=`<b>AI review suggestion · Unverified</b><p>${esc(examples[sel.value])}</p><small>Never automatically change the medication regimen from an AI extraction.</small>`};sel.onchange=update;update()}}render();</script></body></html>
